name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})${{ !startsWith(matrix.os, 'windows-') && ' — experimental' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !startsWith(matrix.os, 'windows-') }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 11 x64 is the release-blocking platform; Linux and macOS
        # are experimental per the QMDX v1 spec. Node 22 and 24 LTS are the
        # initially tested runtimes.
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ["22", "24"]
        exclude:
          - os: windows-latest
            node: "22"
        include:
          - os: windows-2022
            node: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies with Visual Studio 2022
        if: matrix.os == 'windows-2022'
        run: npm ci
        env:
          npm_config_msvs_version: "2022"
      - name: Install dependencies
        if: matrix.os != 'windows-2022'
        run: npm ci
      - run: npm run typecheck
      - run: npm test

  packaging-guard:
    name: packaging guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:package
