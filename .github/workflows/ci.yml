name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})${{ matrix.os != 'windows-latest' && ' — experimental' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 11 x64 is the release-blocking platform; Linux and macOS
        # are experimental per the QMDX v1 spec. Node 22 and 24 LTS are the
        # initially tested runtimes.
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up MSVC for Node 22
        if: matrix.os == 'windows-latest' && matrix.node == '22'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  packaging-guard:
    name: packaging guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:package
